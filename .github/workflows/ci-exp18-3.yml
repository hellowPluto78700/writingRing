name: Exp18.3 CI

on:
  pull_request:
    paths:
      - 'scripts/experiment_18_3_discriminative_coordinate.py'
      - 'scripts/experiment_18_3_discriminative_coordinate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_18_3*'
      - 'tests/test_experiment_18_3_discriminative_coordinate_contract.py'
      - '.github/workflows/ci-exp18-3.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_18_3_discriminative_coordinate.py'
      - 'scripts/experiment_18_3_discriminative_coordinate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_18_3*'
      - 'tests/test_experiment_18_3_discriminative_coordinate_contract.py'
      - '.github/workflows/ci-exp18-3.yml'

permissions:
  contents: read

concurrency:
  group: exp18-3-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn,notebook]'
      - name: Run Exp18.3 focused checks
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_18_3_discriminative_coordinate_contract.py

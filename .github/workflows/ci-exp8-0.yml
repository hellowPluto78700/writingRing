name: Exp8.0 CI

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_8_0_local_backbone_tau_sweep.py'
      - 'scripts/experiment_8_0_local_backbone_tau_sweep/**'
      - 'scripts/bash_script/SNN_Bash/submit_exp_8_0_cpu.bash'
      - 'scripts/bash_script/SNN_Bash/run_exp_8_0_cpu_array.bash'
      - 'scripts/bash_script/SNN_Bash/finalize_exp_8_0_cpu.bash'
      - 'tests/test_experiment_8_0_local_backbone_tau_sweep_contract.py'
      - 'notebooks/experiment_8_0_local_backbone_tau_sweep.ipynb'
      - 'scripts/experiment_7_3_training_strategy_decomposition.py'
      - 'scripts/experiment_7_2_two_layer_tau_training.py'
      - 'scripts/experiment_3_0_1_single_tau_objectives.py'
      - 'scripts/experiment_4_0_1_multispike_macro_lif.py'
      - 'scripts/experiment_5_0_local_evidence_objectives.py'
      - 'scripts/experiment_0_1_general_comparison.py'
      - '.github/workflows/ci-exp8-0.yml'
  pull_request:
    paths:
      - 'scripts/experiment_8_0_local_backbone_tau_sweep.py'
      - 'scripts/experiment_8_0_local_backbone_tau_sweep/**'
      - 'scripts/bash_script/SNN_Bash/submit_exp_8_0_cpu.bash'
      - 'scripts/bash_script/SNN_Bash/run_exp_8_0_cpu_array.bash'
      - 'scripts/bash_script/SNN_Bash/finalize_exp_8_0_cpu.bash'
      - 'tests/test_experiment_8_0_local_backbone_tau_sweep_contract.py'
      - 'notebooks/experiment_8_0_local_backbone_tau_sweep.ipynb'
      - 'scripts/experiment_7_3_training_strategy_decomposition.py'
      - 'scripts/experiment_7_2_two_layer_tau_training.py'
      - 'scripts/experiment_3_0_1_single_tau_objectives.py'
      - 'scripts/experiment_4_0_1_multispike_macro_lif.py'
      - 'scripts/experiment_5_0_local_evidence_objectives.py'
      - 'scripts/experiment_0_1_general_comparison.py'
      - '.github/workflows/ci-exp8-0.yml'

permissions:
  contents: read

concurrency:
  group: exp80-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp8.0 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/submit_exp_8_0_cpu.bash
            scripts/bash_script/SNN_Bash/run_exp_8_0_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_8_0_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp8.0 contract tests
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_8_0_local_backbone_tau_sweep_contract.py

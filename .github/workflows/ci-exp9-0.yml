name: Exp9.0 CI

on:
  push:
    paths:
      - 'scripts/experiment_9_0_within_user_generalization.py'
      - 'scripts/experiment_9_0_within_user_generalization/**'
      - 'scripts/bash_script/SNN_Bash/*exp_9_0*'
      - 'tests/test_experiment_9_0_within_user_generalization_contract.py'
      - 'docs/plans/EXP9_0_WITHIN_USER_GENERALIZATION.md'
      - 'notebooks/experiment_9_0_within_user_generalization.ipynb'
      - '.github/workflows/ci-exp9-0.yml'
  pull_request:
    paths:
      - 'scripts/experiment_9_0_within_user_generalization.py'
      - 'scripts/experiment_9_0_within_user_generalization/**'
      - 'scripts/bash_script/SNN_Bash/*exp_9_0*'
      - 'tests/test_experiment_9_0_within_user_generalization_contract.py'
      - 'docs/plans/EXP9_0_WITHIN_USER_GENERALIZATION.md'
      - 'notebooks/experiment_9_0_within_user_generalization.ipynb'
      - '.github/workflows/ci-exp9-0.yml'

permissions:
  contents: read

concurrency:
  group: exp90-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp9.0 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/prepare_exp_9_0_cpu.bash
            scripts/bash_script/SNN_Bash/submit_exp_9_0_cpu.bash
            scripts/bash_script/SNN_Bash/run_exp_9_0_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_9_0_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp9.0 contract tests
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_9_0_within_user_generalization_contract.py

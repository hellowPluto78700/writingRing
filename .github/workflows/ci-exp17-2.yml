name: Exp17.2 history-input competition CI

on:
  pull_request:
    paths:
      - 'scripts/experiment_17_2_history_input_competition.py'
      - 'scripts/experiment_17_2_history_input_competition/**'
      - 'scripts/bash_script/SNN_Bash/*exp_17_2*.bash'
      - 'tests/test_experiment_17_2_history_input_competition_contract.py'
      - '.github/workflows/ci-exp17-2.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_17_2_history_input_competition.py'
      - 'scripts/experiment_17_2_history_input_competition/**'
      - 'scripts/bash_script/SNN_Bash/*exp_17_2*.bash'
      - 'tests/test_experiment_17_2_history_input_competition_contract.py'
      - '.github/workflows/ci-exp17-2.yml'

permissions:
  contents: read

concurrency:
  group: exp17-2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn,notebook]'

      - name: Run Exp17.2 focused checks
        run: |
          python -m pytest -q             tests/test_repository_source_syntax.py             tests/test_experiment_17_2_history_input_competition_contract.py

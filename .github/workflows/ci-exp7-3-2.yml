name: Exp7.3.2 CI

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_7_3_2_affine_probe_bridge.py'
      - 'scripts/experiment_7_3_2_affine_probe_bridge/**'
      - 'scripts/bash_script/SNN_Bash/*exp_7_3_2*'
      - 'tests/test_experiment_7_3_2_affine_probe_bridge_contract.py'
      - 'notebooks/experiment_7_3_2_affine_probe_bridge.ipynb'
      - 'scripts/experiment_7_3_training_strategy_decomposition.py'
      - 'scripts/experiment_3_0_2_hidden_multitau_architectures.py'
      - '.github/workflows/ci-exp7-3-2.yml'
  pull_request:
    paths:
      - 'scripts/experiment_7_3_2_affine_probe_bridge.py'
      - 'scripts/experiment_7_3_2_affine_probe_bridge/**'
      - 'scripts/bash_script/SNN_Bash/*exp_7_3_2*'
      - 'tests/test_experiment_7_3_2_affine_probe_bridge_contract.py'
      - 'notebooks/experiment_7_3_2_affine_probe_bridge.ipynb'
      - 'scripts/experiment_7_3_training_strategy_decomposition.py'
      - 'scripts/experiment_3_0_2_hidden_multitau_architectures.py'
      - '.github/workflows/ci-exp7-3-2.yml'

permissions:
  contents: read

concurrency:
  group: exp732-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp7.3.2 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/submit_exp_7_3_2_cpu.bash
            scripts/bash_script/SNN_Bash/run_exp_7_3_2_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_7_3_2_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp7.3.2 contract tests
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_7_3_2_affine_probe_bridge_contract.py

name: Exp7.3.3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: exp733-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp7.3.3 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/submit_exp_7_3_3_cpu.bash
            scripts/bash_script/SNN_Bash/run_exp_7_3_3_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_7_3_3_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp7.3.3 contract tests
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_7_3_3_affine_lif_substitution_contract.py

name: Exp15.1 width capacity ablation

on:
  push:
    paths:
      - 'scripts/experiment_15_1_width_capacity_ablation.py'
      - 'scripts/experiment_15_1_width_capacity_ablation/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15_1*'
      - 'tests/test_experiment_15_1_width_capacity_ablation_contract.py'
      - '.github/workflows/ci-exp15-1.yml'
  pull_request:
    paths:
      - 'scripts/experiment_15_1_width_capacity_ablation.py'
      - 'scripts/experiment_15_1_width_capacity_ablation/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15_1*'
      - 'tests/test_experiment_15_1_width_capacity_ablation_contract.py'
      - '.github/workflows/ci-exp15-1.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn torch pytest
      - name: Run Exp15.1 focused checks
        run: |
          python -m pytest -q tests/test_repository_source_syntax.py
          python -m pytest -q tests/test_experiment_15_1_width_capacity_ablation_contract.py

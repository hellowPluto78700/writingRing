name: Repository source syntax

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.bash'
      - 'tests/test_repository_source_syntax.py'
      - '.github/workflows/ci-source-syntax.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.bash'
      - 'tests/test_repository_source_syntax.py'
      - '.github/workflows/ci-source-syntax.yml'

permissions:
  contents: read

concurrency:
  group: source-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run repository source syntax check
        run: python -m pytest -q tests/test_repository_source_syntax.py

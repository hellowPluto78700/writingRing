name: Exp10.2 CI

on:
  push:
    paths:
      - 'scripts/experiment_10_2_l1_membrane_memory.py'
      - 'scripts/experiment_10_2_l1_membrane_memory/**'
      - 'scripts/bash_script/SNN_Bash/*exp_10_2*'
      - 'tests/test_experiment_10_2_l1_membrane_memory_contract.py'
      - 'docs/plans/EXP10_2_L1_MEMBRANE_MEMORY.md'
      - 'notebooks/experiment_10_2_l1_membrane_memory.ipynb'
      - '.github/workflows/ci-exp10-2.yml'
  pull_request:
    paths:
      - 'scripts/experiment_10_2_l1_membrane_memory.py'
      - 'scripts/experiment_10_2_l1_membrane_memory/**'
      - 'scripts/bash_script/SNN_Bash/*exp_10_2*'
      - 'tests/test_experiment_10_2_l1_membrane_memory_contract.py'
      - 'docs/plans/EXP10_2_L1_MEMBRANE_MEMORY.md'
      - 'notebooks/experiment_10_2_l1_membrane_memory.ipynb'
      - '.github/workflows/ci-exp10-2.yml'

permissions:
  contents: read

concurrency:
  group: exp10-2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp10.2 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/prepare_exp_10_2_cpu.bash
            scripts/bash_script/SNN_Bash/run_exp_10_2_baseline_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_10_2_long_e2e_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_10_2_replay_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_10_2_stage_a_cpu.bash
            scripts/bash_script/SNN_Bash/finalize_exp_10_2_cpu.bash
            scripts/bash_script/SNN_Bash/submit_exp_10_2_stage_a_cpu.bash
            scripts/bash_script/SNN_Bash/submit_exp_10_2_stage_b_cpu.bash
            scripts/bash_script/SNN_Bash/submit_exp_10_2_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp10.2 focused checks
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_10_2_l1_membrane_memory_contract.py

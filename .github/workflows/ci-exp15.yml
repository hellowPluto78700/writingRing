name: Exp15 context write gate

on:
  push:
    paths:
      - 'scripts/experiment_15_context_dependent_write_gate.py'
      - 'scripts/experiment_15_context_dependent_write_gate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15*'
      - 'tests/test_experiment_15_context_dependent_write_gate_contract.py'
      - '.github/workflows/ci-exp15.yml'
  pull_request:
    paths:
      - 'scripts/experiment_15_context_dependent_write_gate.py'
      - 'scripts/experiment_15_context_dependent_write_gate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15*'
      - 'tests/test_experiment_15_context_dependent_write_gate_contract.py'
      - '.github/workflows/ci-exp15.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn torch pytest
      - name: Run Exp15 focused checks
        run: |
          python -m pytest -q tests/test_repository_source_syntax.py
          python -m pytest -q tests/test_experiment_15_context_dependent_write_gate_contract.py

name: Exp15 context write gate

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_15_context_dependent_write_gate.py'
      - 'scripts/experiment_15_context_dependent_write_gate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15*'
      - 'tests/test_experiment_15_context_dependent_write_gate_contract.py'
      - '.github/workflows/ci-exp15.yml'
  pull_request:
    paths:
      - 'scripts/experiment_15_context_dependent_write_gate.py'
      - 'scripts/experiment_15_context_dependent_write_gate/**'
      - 'scripts/bash_script/SNN_Bash/*exp_15*'
      - 'tests/test_experiment_15_context_dependent_write_gate_contract.py'
      - '.github/workflows/ci-exp15.yml'

permissions:
  contents: read

concurrency:
  group: exp15-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Run focused checks
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_15_context_dependent_write_gate_contract.py

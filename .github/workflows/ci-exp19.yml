name: Exp19 CI

on:
  pull_request:
    paths:
      - 'scripts/experiment_19_cross_user_generalization.py'
      - 'scripts/experiment_19_cross_user_generalization/**'
      - 'scripts/bash_script/SNN_Bash/*exp_19*'
      - 'tests/test_experiment_19_cross_user_generalization_contract.py'
      - '.github/workflows/ci-exp19.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_19_cross_user_generalization.py'
      - 'scripts/experiment_19_cross_user_generalization/**'
      - 'scripts/bash_script/SNN_Bash/*exp_19*'
      - 'tests/test_experiment_19_cross_user_generalization_contract.py'
      - '.github/workflows/ci-exp19.yml'

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn,notebook]'
      - name: Run Exp19 focused checks
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_19_cross_user_generalization_contract.py

name: Temporary Exp5.3 tau242 main migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[exp53-tau242]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace Exp5.3 non-leaky LIF control with tau_mem 242 ms
        run: |
          python - <<'PY'
          from pathlib import Path

          code_path = Path('scripts/experiment_5_3_synaptic_contextual_evidence.py')
          code = code_path.read_text(encoding='utf-8')
          old = '    Condition("lif_beta100", "lif", 1.00),'
          new = '    Condition("lif_tau242", "lif", 0.9375),'
          assert code.count(old) == 1, code.count(old)
          code = code.replace(old, new)
          assert 'lif_beta100' not in code
          code_path.write_text(code, encoding='utf-8')

          readme_path = Path('scripts/experiment_5_3/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('`lif_beta100`', '`lif_tau242`')
          readme = readme.replace('| `lif_tau242` | one non-leaky LIF layer | beta = 1.00 |', '| `lif_tau242` | one long-membrane LIF layer | beta = 0.9375 (shift_mem = 4) |')
          readme = readme.replace('The two pure-LIF controls differ only in beta; `lif_tau242` has no passive membrane leak:', 'The two pure-LIF controls differ only in membrane decay; `lif_tau242` uses repository-style `shift_mem=4`:')
          readme = readme.replace('lif_tau242: tau_mem = inf (no passive membrane leak)', 'lif_tau242: beta = 0.9375, shift_mem = 4, tau_mem about 242 ms at 64 Hz')
          readme = readme.replace('lif_tau242 - lif_beta050', 'lif_tau242 - lif_beta050')
          assert 'lif_beta100' not in readme
          assert 'tau_mem = inf' not in readme
          assert 'no passive membrane leak' not in readme
          readme_path.write_text(readme, encoding='utf-8')

          notebook_path = Path('notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb')
          notebook = notebook_path.read_text(encoding='utf-8')
          notebook = notebook.replace('lif_beta100', 'lif_tau242')
          notebook = notebook.replace('The LIF `beta=1.00` versus `beta=0.50` comparison is fixed a priori.', 'The LIF `tau_mem≈242 ms (beta=0.9375)` versus `beta=0.50` comparison is fixed a priori.')
          assert 'lif_beta100' not in notebook
          notebook_path.write_text(notebook, encoding='utf-8')

          test_path = Path('tests/test_experiment_5_3_contract.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('"lif_beta100"', '"lif_tau242"')
          test = test.replace('test_lif_beta100_and_beta050_are_explicit_controls', 'test_lif_tau242_and_beta050_are_explicit_controls')
          test = test.replace('beta100 = exp53.CONDITION_BY_NAME["lif_tau242"]', 'tau242 = exp53.CONDITION_BY_NAME["lif_tau242"]')
          test = test.replace('assert beta100.family == beta050.family == "lif"', 'assert tau242.family == beta050.family == "lif"')
          test = test.replace('assert beta100.beta == 1.00', 'assert tau242.beta == 0.9375')
          test = test.replace('assert beta100.shifts_syn == beta050.shifts_syn == ()', 'assert tau242.shifts_syn == beta050.shifts_syn == ()')
          test = test.replace('assert math.isinf(exp53.tau_ms_from_decay(1.00, 64.0))', 'assert math.isclose(exp53.tau_ms_from_decay(0.9375, 64.0), 242.1, rel_tol=0.02)')
          test = test.replace('"one non-leaky LIF layer",', '"one long-membrane LIF layer",')
          test = test.replace('"lif_beta100 - lif_beta050",', '"lif_tau242 - lif_beta050",')
          assert 'lif_beta100' not in test
          assert 'beta100' not in test
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate Exp5.3 sources
        run: |
          python -m py_compile scripts/experiment_5_3_synaptic_contextual_evidence.py tests/test_experiment_5_3_contract.py
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          beta = 0.9375
          tau_ms = -(1000.0 / 64.0) / math.log(beta)
          assert math.isclose(tau_ms, 242.1, rel_tol=0.02)
          nb = json.loads(Path('notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb').read_text(encoding='utf-8'))
          joined = '\n'.join(''.join(cell.get('source', [])) for cell in nb['cells'])
          assert 'lif_tau242' in joined
          assert 'lif_beta100' not in joined
          for i, cell in enumerate(nb['cells']):
              if cell.get('cell_type') == 'code':
                  compile(''.join(cell.get('source', [])), f'cell-{i}', 'exec')
          PY

      - name: Commit directly to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/experiment_5_3_synaptic_contextual_evidence.py scripts/experiment_5_3/README.md notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb tests/test_experiment_5_3_contract.py
          git commit -m '[exp53-tau242] Set LIF control tau_mem to 242 ms'
          git push origin HEAD:main

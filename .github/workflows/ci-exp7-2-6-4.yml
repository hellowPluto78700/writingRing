name: Exp7.2.6.4 CI

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_7_2_6_4_output_interface_decomposition.py'
      - 'scripts/experiment_7_2_6_4_output_interface_decomposition/**'
      - 'scripts/bash_script/SNN_Bash/*exp_7_2_6_4*'
      - 'tests/test_experiment_7_2_6_4_output_interface_contract.py'
      - 'notebooks/experiment_7_2_6_4_output_interface_decomposition.ipynb'
      - 'scripts/experiment_7_2_two_layer_tau_training.py'
      - 'scripts/experiment_7_2_6_output_readout_loss_shaping.py'
      - 'scripts/experiment_7_2_6_1_sum_vs_mean_ce.py'
      - 'scripts/experiment_7_2_6_3_linear_vs_lif_frozen_l2.py'
      - '.github/workflows/ci-exp7-2-6-4.yml'
  pull_request:
    paths:
      - 'scripts/experiment_7_2_6_4_output_interface_decomposition.py'
      - 'scripts/experiment_7_2_6_4_output_interface_decomposition/**'
      - 'scripts/bash_script/SNN_Bash/*exp_7_2_6_4*'
      - 'tests/test_experiment_7_2_6_4_output_interface_contract.py'
      - 'notebooks/experiment_7_2_6_4_output_interface_decomposition.ipynb'
      - 'scripts/experiment_7_2_two_layer_tau_training.py'
      - 'scripts/experiment_7_2_6_output_readout_loss_shaping.py'
      - 'scripts/experiment_7_2_6_1_sum_vs_mean_ce.py'
      - 'scripts/experiment_7_2_6_3_linear_vs_lif_frozen_l2.py'
      - '.github/workflows/ci-exp7-2-6-4.yml'

permissions:
  contents: read

concurrency:
  group: exp7264-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp7.2.6.4 Slurm scripts
        run: |
          scripts=(
            scripts/bash_script/SNN_Bash/submit_exp_7_2_6_4_cpu.bash
            scripts/bash_script/SNN_Bash/prepare_exp_7_2_6_4_cache_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_7_2_6_4_part_a_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_7_2_6_4_part_b_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_7_2_6_4_part_c_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_7_2_6_4_part_d_cpu_array.bash
            scripts/bash_script/SNN_Bash/run_exp_7_2_6_4_gradient_cpu_array.bash
            scripts/bash_script/SNN_Bash/finalize_exp_7_2_6_4_cpu.bash
          )
          for script in "${scripts[@]}"; do
            test -f "$script"
            bash -n "$script"
          done

      - name: Run Exp7.2.6.4 contract tests
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_7_2_6_4_output_interface_contract.py

name: Shared core CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'snn/**'
      - 'core/**'
      - 'core_benchmark_v1/**'
      - 'utils/**'
      - 'scripts/common/**'
      - 'scripts/utils/**'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'snn/**'
      - 'core/**'
      - 'core_benchmark_v1/**'
      - 'utils/**'
      - 'scripts/common/**'
      - 'scripts/utils/**'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: shared-core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Run shared-impact contract regression
        run: |
          python -m pytest -q --durations=10 \
            tests/test_repository_source_syntax.py \
            tests/test_*contract*.py

name: Exp13 CI

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/experiment_13_hierarchical_temporal_representation.py'
      - 'scripts/experiment_13_hierarchical_temporal_representation/**'
      - 'scripts/bash_script/SNN_Bash/*exp_13*'
      - 'tests/test_experiment_13_hierarchical_temporal_representation_contract.py'
      - 'notebooks/experiment_13_hierarchical_temporal_representation.ipynb'
      - '.github/workflows/ci-exp13.yml'
  pull_request:
    paths:
      - 'scripts/experiment_13_hierarchical_temporal_representation.py'
      - 'scripts/experiment_13_hierarchical_temporal_representation/**'
      - 'scripts/bash_script/SNN_Bash/*exp_13*'
      - 'tests/test_experiment_13_hierarchical_temporal_representation_contract.py'
      - 'notebooks/experiment_13_hierarchical_temporal_representation.ipynb'
      - '.github/workflows/ci-exp13.yml'

permissions:
  contents: read

concurrency:
  group: exp13-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,snn]'

      - name: Validate Exp13 source and contract
        run: |
          python -m pytest -q \
            tests/test_repository_source_syntax.py \
            tests/test_experiment_13_hierarchical_temporal_representation_contract.py

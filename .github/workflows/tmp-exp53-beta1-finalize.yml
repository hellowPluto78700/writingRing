name: Temporary Exp5.3 beta1 finalization

on:
  push:
    branches:
      - exp5-3-synaptic-contextual-evidence

permissions:
  contents: write

jobs:
  finalize-beta1:
    if: ${{ !contains(github.event.head_commit.message, '[beta1-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp5-3-synaptic-contextual-evidence
          fetch-depth: 0
      - name: Finalize beta1 comparisons and wording
        run: |
          python - <<'PY'
          from pathlib import Path

          nb_path = Path('notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb')
          nb = nb_path.read_text(encoding='utf-8')
          old_pair = '(\\"lif_beta050\\",\\"lif_beta100\\")'
          new_pair = '(\\"lif_beta100\\",\\"lif_beta050\\")'
          assert nb.count(old_pair) == 1, nb.count(old_pair)
          nb = nb.replace(old_pair, new_pair)
          assert old_pair not in nb
          nb_path.write_text(nb, encoding='utf-8')

          readme_path = Path('scripts/experiment_5_3/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_row = '| `lif_beta100` | one short LIF layer | beta = 1.00 |'
          new_row = '| `lif_beta100` | one non-leaky LIF layer | beta = 1.00 |'
          assert readme.count(old_row) == 1, readme.count(old_row)
          readme = readme.replace(old_row, new_row)
          old_sentence = 'The two pure-LIF controls differ only in beta:'
          new_sentence = 'The two pure-LIF controls differ only in beta; `lif_beta100` has no passive membrane leak:'
          assert readme.count(old_sentence) == 1, readme.count(old_sentence)
          readme = readme.replace(old_sentence, new_sentence)
          readme_path.write_text(readme, encoding='utf-8')

          test_path = Path('tests/test_experiment_5_3_contract.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    for forbidden in (\n'
          insertion = '    assert \'("lif_beta100","lif_beta050")\' in joined.replace(" ", "")\n'
          assert test.count(anchor) == 1
          test = test.replace(anchor, insertion + anchor)
          readme_anchor = '''    for token in (\n        "Synaptic history contextualization",\n        "lif_beta100",\n        "lif_beta050",\n'''
          assert test.count(readme_anchor) == 1, test.count(readme_anchor)
          test = test.replace(
              readme_anchor,
              readme_anchor + '        "one non-leaky LIF layer",\n        "lif_beta100 - lif_beta050",\n',
          )
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          python -m py_compile tests/test_experiment_5_3_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb').read_text(encoding='utf-8'))
          joined = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'])
          compact = joined.replace(' ', '')
          assert '("lif_beta100","lif_beta050")' in compact
          assert '("lif_beta050","lif_beta100")' not in compact
          readme = Path('scripts/experiment_5_3/README.md').read_text(encoding='utf-8')
          assert 'one non-leaky LIF layer' in readme
          assert 'lif_beta100 - lif_beta050' in readme
          PY
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notebooks/experiment_5_3_synaptic_contextual_evidence.ipynb scripts/experiment_5_3/README.md tests/test_experiment_5_3_contract.py
          git commit -m '[beta1-finalized] Finalize Exp5.3 beta=1 comparison wording'
          git push origin HEAD:exp5-3-synaptic-contextual-evidence

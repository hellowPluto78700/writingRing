[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writingring"
version = "0.1.0"
description = "Local discovery and visualization tools for WritingRing recordings"
requires-python = ">=3.11"
dependencies = [
    "compress-pickle",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

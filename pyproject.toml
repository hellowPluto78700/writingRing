[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writingring"
version = "0.1.0"
description = "Local discovery and visualization tools for WritingRing recordings"
requires-python = ">=3.10"
dependencies = [
    "compress-pickle",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest>=8"]
xylo = [
    "rockpool==2.9.1",
    "samna==0.43.0.0",
    "xylosim==0.1.3",
]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
]

[tool.setuptools]
packages = ["writingring", "writingring.spike_encoding", "writingring.spike_encoding.encoders", "core", "core.sensel_lib"]
package-dir = { writingring = "src/writingring", core = "core", "core.sensel_lib" = "core/sensel_lib" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
